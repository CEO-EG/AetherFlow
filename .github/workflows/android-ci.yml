name: AetherFlow Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_native_cores:
        description: "Compile gomobile/NDK native cores from upstream source"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-cores:
    name: Build Native Cores (Optional Full NDK/Go Matrix)
    if: ${{ inputs.build_native_cores == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Android NDK r28
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Compile LibXray, libbox, and hev-socks5-tunnel
        run: |
          chmod +x scripts/build-cores.sh
          ./scripts/build-cores.sh xray
          ./scripts/build-cores.sh singbox
          ./scripts/build-cores.sh hev

      - name: Upload Native Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aetherflow-native-cores
          path: |
            core/engine-xray/libs/*.aar
            core/engine-singbox/libs/*.aar
            core/tun/src/main/jniLibs/**/*.so

  verify-and-build:
    name: Unit Tests, Lint & Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Native Core Checksums
        run: ./gradlew verifyNativeCores

      - name: Run JUnit 5 Unit Tests, Lint & Assemble Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload Debug APK & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherflow-debug-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/reports/lint-results-debug.html
            **/build/reports/tests/testDebugUnitTest/
