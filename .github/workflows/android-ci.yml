name: AetherFlow Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Native Cores, Unit Tests, Lint & APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Download & Verify Native Core Checksums
        run: ./gradlew downloadNativeCores verifyNativeCores

      - name: Run JUnit 5 Unit Tests, Lint & Assemble APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Upload APKs & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherflow-build-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            **/build/reports/lint-results-debug.html
            **/build/reports/tests/testDebugUnitTest/
